aid: census-co
name: Census
description: Census, now operating as Fivetran Activations following its acquisition by Fivetran, is a reverse ETL and data activation platform that turns the data warehouse into the operational source of truth for go-to-market and product teams. The platform configures managed, no-code reverse ETL pipelines that move modeled data from warehouses like Snowflake, BigQuery, Databricks, and Redshift into more than 200 SaaS destinations across CRM, marketing automation, advertising, customer success, product, finance, and productivity tools. Census also offers an Audience Hub for visual segment building, an Embedded product for white-labeling reverse ETL inside customer-facing applications, and a Connect workflow for collecting end-user credentials and programmatically creating sync pipelines. Developers integrate through the Census Management API, Embedded API, Connect Links, custom destination APIs, and a Terraform provider. This profile covers the Census product line and is distinct from the US Census Bureau public APIs.
